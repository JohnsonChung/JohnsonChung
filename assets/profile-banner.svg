<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%">
  <defs>
    <style>
      @keyframes pulse-yellow {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      @keyframes pulse-orange {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.2; }
      }
      @keyframes scanline {
        0% { transform: translateY(0px); opacity: 0; }
        15% { opacity: 0.14; }
        85% { opacity: 0.14; }
        100% { transform: translateY(260px); opacity: 0; }
      }
      .led-online { animation: pulse-yellow 2.4s infinite ease-in-out; }
      .led-warn { animation: pulse-orange 1.8s infinite ease-in-out; }
      .scan-bar { animation: scanline 6s infinite linear; }
    </style>

    <!-- Blueprint Grid Pattern -->
    <pattern id="ef-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.045"/>
    </pattern>
    <!-- Hazard Stripe Pattern -->
    <pattern id="ef-hazard" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="8" height="16" fill="#FFE600"/>
      <rect x="8" width="8" height="16" fill="#141517"/>
    </pattern>
  </defs>

  <!-- Base Dark Industrial Canvas -->
  <rect width="1200" height="280" fill="#141517"/>
  <rect width="1200" height="280" fill="url(#ef-grid)"/>

  <!-- Animated Subtle Scanline -->
  <rect class="scan-bar" x="0" y="0" width="1200" height="2" fill="#FFE600"/>

  <!-- Top Hazard Bar & Accent Line -->
  <rect x="0" y="0" width="240" height="8" fill="url(#ef-hazard)"/>
